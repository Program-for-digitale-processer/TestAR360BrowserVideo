<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>KuumAR</title>
  </head>
  <body style="margin: 0; padding: 0; background: #000;">

    <div id="unity-container" style="position: relative; width: 100%; height: 100%;">
      <canvas id="unity-canvas"></canvas>
      
      <div id="fullscreen-shield" style="
        display: none; 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        z-index: 99999; 
        background: transparent;
      "></div>
    </div>

    <script>
      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const shield = document.querySelector("#fullscreen-shield");

      let isVirtuallyFullscreen = false;

      function fillScreen() {
          const vv = window.visualViewport;
          const w = (vv ? vv.width : window.innerWidth) + "px";
          const h = (vv ? vv.height : window.innerHeight) + "px";
          
          document.body.style.overflow = "hidden";
          document.body.style.margin = "0";
          
          container.style.position = "fixed";
          container.style.top = "0"; 
          container.style.left = "0";
          container.style.zIndex = "99998"; // Sits just under the click shield
          
          container.style.width = w; 
          container.style.height = h;
          canvas.style.width = w; 
          canvas.style.height = h;
          
          window.scrollTo(0, 0);
      }

      // Global bridge function executed via Unity JSLIB
      window.activateFullscreenShield = function() {
          if (shield) {
              shield.style.display = "block";
          }
      };

      // Handle the touch event natively to bypass Chrome's user gesture token timeout
      shield.addEventListener("click", async () => {
          // 1. Instantly stretch layout via CSS so the game window expands IMMEDIATELY
          fillScreen();
          isVirtuallyFullscreen = true;
          shield.style.display = "none";

          // 2. Safely attempt to trigger native browser fullscreen
          try {
              if (container.requestFullscreen) {
                  await container.requestFullscreen();
              } else if (container.webkitRequestFullscreen) {
                  await container.webkitRequestFullscreen();
              }
          } catch (e) {
              console.log("Chrome activation token expired. Operating safely in Virtual Fullscreen.");
          }

          // 3. Wake up the WebGL context repaint mechanism
          triggerWebGLResize();
      });

      function triggerWebGLResize() {
          if (typeof requestAnimationFrame === "function") {
              requestAnimationFrame(() => {
                  window.dispatchEvent(new Event('resize'));
                  setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 50);
              });
          }
      }

      // Watch for background interruptions (like exiting fullscreen or popups)
      window.addEventListener("resize", () => {
          const isNativeFs = document.fullscreenElement || document.webkitFullscreenElement;
          
          if (!isNativeFs) {
              if (isVirtuallyFullscreen) {
                  fillScreen(); // Hold layout visually
              } else {
                  shield.style.display = "block"; // Reactivate overlay safety net
              }
          } else {
              fillScreen();
          }
          
          triggerWebGLResize();
      });
    </script>
  </body>
</html>
