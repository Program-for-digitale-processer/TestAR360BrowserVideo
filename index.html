<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>KuumAR fullscreen</title>

  <meta
    name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      position: fixed;
      inset: 0;
      touch-action: none;
      overscroll-behavior: none;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #unity-canvas {
      background: #000;
      display: block;
      width: 100%;
      height: 100%;
    }

    #unity-container:fullscreen {
      width: 100vw;
      height: 100vh;
    }

    #unity-container:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
    }

    #custom-start-overlay,
    #restore-fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
      padding: 20px;
    }

    #custom-start-overlay {
      z-index: 1000;
    }

    #restore-fullscreen-overlay {
      display: none;
      background: rgba(0, 0, 0, 0.85);
      z-index: 30000;
    }

    #btn-play,
    #btn-restore {
      padding: 20px 40px;
      font-size: 24px;
      color: #fff;
      background: #2196f3;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: sans-serif;
      font-weight: bold;
    }

    #btn-restore {
      background: #4caf50;
      padding: 15px 30px;
      font-size: 20px;
    }

    #unity-loading-bar {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 1500;
    }

    #unity-progress-bar-empty {
      width: 200px;
      height: 10px;
      background: #333;
      margin-top: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 5px;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.2s linear;
    }

    #loading-debug,
    .overlay-text {
      color: #fff;
      font-family: sans-serif;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.75;
      text-align: center;
    }

    .overlay-text {
      font-size: 14px;
      padding: 0 20px;
      max-width: 520px;
      line-height: 1.4;
    }

    #orientation-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      z-index: 40000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    @media screen and (orientation: portrait) and (max-width: 1024px) {
      #orientation-warning {
        display: flex;
      }
    }

    .rotate-icon {
      font-size: 60px;
      margin-bottom: 20px;
      display: inline-block;
      animation: rotate-phone 2s ease-in-out infinite;
    }

    @keyframes rotate-phone {
      0%, 100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(-90deg);
      }
    }
  </style>
</head>

<body>
  <div id="orientation-warning">
    <div class="rotate-icon">&#128241;</div>
    <p style="font-weight: bold;">Please rotate your device</p>
    <p style="opacity: 0.7; font-size: 0.9em;">
      Landscape mode is required for this experience.
    </p>
  </div>

  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="custom-start-overlay">
      <button id="btn-play">START EXPERIENCE</button>
      <p class="overlay-text">
        Tap to begin. Make sure the device is in landscape position.
      </p>
    </div>

    <div id="restore-fullscreen-overlay">
      <button id="btn-restore">RESTORE FULLSCREEN</button>
      <p class="overlay-text">
        The browser exited fullscreen during the location permission step.
        Tap to resume fullscreen.
      </p>
    </div>

    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="loading-debug">Preparing...</div>
    </div>
  </div>

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const loadingDebug = document.querySelector("#loading-debug");
    const startOverlay = document.querySelector("#custom-start-overlay");
    const playButton = document.querySelector("#btn-play");
    const restoreOverlay = document.querySelector("#restore-fullscreen-overlay");
    const restoreButton = document.querySelector("#btn-restore");

    let started = false;
    let fullscreenWanted = false;

    let fillScreenScheduled = false;
    let syntheticResizeInProgress = false;

    let fullscreenCheckTimer1 = null;
    let fullscreenCheckTimer2 = null;
    let fullscreenCheckTimer3 = null;

    let lastWidth = 0;
    let lastHeight = 0;
    let lastProgressPercent = -1;

    function unityShowBanner(msg, type) {
      if (type !== "error") return;
      if (document.getElementById("unity-crash-overlay")) return;

      const overlay = document.createElement("div");
      overlay.id = "unity-crash-overlay";

      Object.assign(overlay.style, {
        position: "fixed",
        inset: "0",
        width: "100%",
        height: "100%",
        backgroundColor: "rgba(0,0,0,0.95)",
        display: "flex",
        flexDirection: "column",
        justifyContent: "center",
        alignItems: "center",
        zIndex: "50000",
        color: "white",
        fontFamily: "sans-serif",
        textAlign: "center",
        padding: "20px",
        boxSizing: "border-box"
      });

      const box = document.createElement("div");

      const title = document.createElement("h2");
      title.textContent = "Error";
      title.style.color = "#ff4444";

      const message = document.createElement("p");
      message.textContent = String(msg);

      const button = document.createElement("button");
      button.textContent = "REFRESH";

      Object.assign(button.style, {
        padding: "10px 20px",
        background: "#2196F3",
        border: "none",
        color: "white",
        borderRadius: "5px",
        cursor: "pointer"
      });

      button.onclick = function () {
        location.reload();
      };

      box.appendChild(title);
      box.appendChild(message);
      box.appendChild(button);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
    }

    function isNativeFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement
      );
    }

    function fillScreen() {
      const vv = window.visualViewport;
      const width = vv ? vv.width : window.innerWidth;
      const height = vv ? vv.height : window.innerHeight;

      if (width !== lastWidth || height !== lastHeight) {
        lastWidth = width;
        lastHeight = height;

        container.style.width = width + "px";
        container.style.height = height + "px";

        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      window.scrollTo(0, 0);
    }

    function scheduleFillScreen() {
      if (fillScreenScheduled) return;

      fillScreenScheduled = true;

      requestAnimationFrame(function () {
        fillScreenScheduled = false;
        fillScreen();
      });
    }

    function triggerUnityResize() {
      syntheticResizeInProgress = true;

      window.dispatchEvent(new Event("resize"));

      setTimeout(function () {
        window.dispatchEvent(new Event("resize"));
      }, 100);

      setTimeout(function () {
        window.dispatchEvent(new Event("resize"));
        syntheticResizeInProgress = false;
      }, 400);
    }

    function clearFullscreenCheckTimers() {
      clearTimeout(fullscreenCheckTimer1);
      clearTimeout(fullscreenCheckTimer2);
      clearTimeout(fullscreenCheckTimer3);

      fullscreenCheckTimer1 = null;
      fullscreenCheckTimer2 = null;
      fullscreenCheckTimer3 = null;
    }

    function setRestoreOverlayVisible(visible, reason) {
      restoreOverlay.style.display = visible ? "flex" : "none";

      if (visible && loadingDebug) {
        loadingDebug.textContent = "Fullscreen interrupted: " + reason;
      }
    }

    function shouldShowRestoreOverlay() {
      return fullscreenWanted && !isNativeFullscreen();
    }

    function forceShowRestoreOverlay(reason) {
      fullscreenWanted = true;

      scheduleFillScreen();

      if (isNativeFullscreen()) {
        setRestoreOverlayVisible(false, reason + " / already fullscreen");
        return;
      }

      restoreOverlay.style.display = "flex";

      if (loadingDebug) {
        loadingDebug.textContent = "Restore overlay shown: " + reason;
      }

      console.log("[FullscreenRecovery] Restore overlay shown:", reason);
    }

    function checkFullscreenAndMaybeShowRestore(reason) {
      scheduleFillScreen();

      if (shouldShowRestoreOverlay()) {
        setRestoreOverlayVisible(true, reason);
      } else {
        setRestoreOverlayVisible(false, reason);
      }
    }

    function startFullscreenRecoveryWatch(reason) {
      if (!fullscreenWanted) return;

      clearFullscreenCheckTimers();

      fullscreenCheckTimer1 = setTimeout(function () {
        checkFullscreenAndMaybeShowRestore(reason + " / 800ms");
      }, 800);

      fullscreenCheckTimer2 = setTimeout(function () {
        checkFullscreenAndMaybeShowRestore(reason + " / 1500ms");
      }, 1500);

      fullscreenCheckTimer3 = setTimeout(function () {
        checkFullscreenAndMaybeShowRestore(reason + " / 2500ms");
      }, 2500);
    }

    function requestAppFullscreen(reason) {
      fullscreenWanted = true;

      const target = container || document.documentElement;

      try {
        let request = null;

        if (target.requestFullscreen) {
          request = target.requestFullscreen({ navigationUI: "hide" });
        } else if (target.webkitRequestFullscreen) {
          request = target.webkitRequestFullscreen();
        } else {
          const msg = "Fullscreen API is not available on this browser.";
          console.warn(msg);

          if (loadingDebug) {
            loadingDebug.textContent = msg;
          }

          return Promise.resolve(false);
        }

        if (request && typeof request.then === "function") {
          return request
            .then(function () {
              return new Promise(function (resolve) {
                setTimeout(function () {
                  const success = isNativeFullscreen();

                  if (success) {
                    console.log("[Fullscreen] Success:", reason);

                    if (loadingDebug) {
                      loadingDebug.textContent = "Fullscreen restored.";
                    }

                    try {
                      if (screen.orientation && screen.orientation.lock) {
                        const lockRequest = screen.orientation.lock("landscape");

                        if (lockRequest && typeof lockRequest.catch === "function") {
                          lockRequest.catch(function (e) {
                            console.warn("Orientation lock failed:", e);
                          });
                        }
                      }
                    } catch (e) {
                      console.warn("Orientation lock exception:", e);
                    }
                  } else {
                    console.warn("[Fullscreen] Request resolved, but browser stayed windowed:", reason);

                    if (loadingDebug) {
                      loadingDebug.textContent =
                        "Fullscreen request completed, but Chrome stayed windowed.";
                    }
                  }

                  fillScreen();
                  triggerUnityResize();

                  resolve(success);
                }, 300);
              });
            })
            .catch(function (e) {
              console.warn("[Fullscreen] Request rejected:", e);

              if (loadingDebug) {
                loadingDebug.textContent =
                  "Fullscreen rejected: " + (e && e.message ? e.message : e);
              }

              fillScreen();
              triggerUnityResize();

              return false;
            });
        }

        return new Promise(function (resolve) {
          setTimeout(function () {
            const success = isNativeFullscreen();

            if (success) {
              console.log("[Fullscreen] WebKit fullscreen success:", reason);

              if (loadingDebug) {
                loadingDebug.textContent = "Fullscreen restored.";
              }
            } else {
              console.warn("[Fullscreen] WebKit request finished, but browser stayed windowed:", reason);

              if (loadingDebug) {
                loadingDebug.textContent =
                  "Fullscreen request sent, but browser stayed windowed.";
              }
            }

            fillScreen();
            triggerUnityResize();

            resolve(success);
          }, 500);
        });
      } catch (e) {
        console.warn("[Fullscreen] Exception:", e);

        if (loadingDebug) {
          loadingDebug.textContent =
            "Fullscreen exception: " + (e && e.message ? e.message : e);
        }

        fillScreen();
        triggerUnityResize();

        return Promise.resolve(false);
      }
    }

    function handleFullscreenChange(reason) {
      if (!started) return;

      if (isNativeFullscreen()) {
        clearFullscreenCheckTimers();
        setRestoreOverlayVisible(false, reason);
      } else {
        startFullscreenRecoveryWatch(reason);
      }

      scheduleFillScreen();
      triggerUnityResize();
    }

    document.addEventListener("fullscreenchange", function () {
      handleFullscreenChange("fullscreenchange");
    });

    document.addEventListener("webkitfullscreenchange", function () {
      handleFullscreenChange("webkitfullscreenchange");
    });

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        startFullscreenRecoveryWatch("visibilitychange visible");
      }
    });

    window.addEventListener("focus", function () {
      startFullscreenRecoveryWatch("window focus");
    });

    window.addEventListener("pageshow", function () {
      startFullscreenRecoveryWatch("pageshow");
    });

    window.addEventListener("resize", function () {
      scheduleFillScreen();

      if (!syntheticResizeInProgress) {
        startFullscreenRecoveryWatch("window resize");
      }
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", function () {
        scheduleFillScreen();

        if (!syntheticResizeInProgress) {
          startFullscreenRecoveryWatch("visualViewport resize");
        }
      });

      window.visualViewport.addEventListener("scroll", function () {
        scheduleFillScreen();

        if (!syntheticResizeInProgress) {
          startFullscreenRecoveryWatch("visualViewport scroll");
        }
      });
    }

    /*
      Called from Unity through ActivateFullscreenInIndex.jslib
    */
    window.LocationPermissionAboutToShow = function () {
      console.log("[FullscreenRecovery] LocationPermissionAboutToShow called");

      fullscreenWanted = true;

      clearFullscreenCheckTimers();
      setRestoreOverlayVisible(false, "location permission starting");

      if (loadingDebug) {
        loadingDebug.textContent = "Location permission is opening...";
      }
    };

    window.LocationPermissionFinished = function () {
      console.log("[FullscreenRecovery] LocationPermissionFinished called");

      fullscreenWanted = true;

      if (loadingDebug) {
        loadingDebug.textContent = "Location permission finished. Checking fullscreen...";
      }

      startFullscreenRecoveryWatch("location permission finished");
    };

    window.ForceFullscreenRecoveryCheck = function () {
      console.log("[FullscreenRecovery] ForceFullscreenRecoveryCheck called");

      fullscreenWanted = true;

      forceShowRestoreOverlay("manual recovery check");
      startFullscreenRecoveryWatch("manual recovery check");
    };

    window.TestFullscreenOverlay = function () {
      console.log("[FullscreenRecovery] TestFullscreenOverlay called");
      forceShowRestoreOverlay("manual browser console test");
    };

    restoreButton.onclick = function (event) {
      event.preventDefault();
      event.stopPropagation();

      fullscreenWanted = true;

      if (loadingDebug) {
        loadingDebug.textContent = "Restore button tapped. Requesting fullscreen...";
      }

      requestAppFullscreen("restore button click").then(function (success) {
        if (success) {
          clearFullscreenCheckTimers();
          setRestoreOverlayVisible(false, "fullscreen restored");
        } else {
          setRestoreOverlayVisible(true, "restore clicked but Chrome stayed windowed");
        }
      });
    };

    playButton.onclick = function () {
      if (started) return;

      const isPortraitMobile =
        window.innerHeight > window.innerWidth &&
        window.innerWidth < 1024;

      if (isPortraitMobile) {
        alert("Please rotate to landscape first!");
        return;
      }

      started = true;
      fullscreenWanted = true;

      startOverlay.style.display = "none";
      loadingBar.style.display = "block";
      progressBarFull.style.transform = "scaleX(0)";
      loadingDebug.textContent = "Starting Unity loader...";

      requestAppFullscreen("start button click");

      const buildUrl = "Build";

      /*
        IMPORTANT:
        This must match your Unity WebGL build files.

        Example:
        Build/Parnuma_FullscreenTest.loader.js
        Build/Parnuma_FullscreenTest.data.unityweb
        Build/Parnuma_FullscreenTest.framework.js.unityweb
        Build/Parnuma_FullscreenTest.wasm.unityweb
      */
      const buildName = "ParnumaFullscreentest";

      const loaderUrl = buildUrl + "/" + buildName + ".loader.js";

      const config = {
        dataUrl: buildUrl + "/" + buildName + ".data.unityweb",
        frameworkUrl: buildUrl + "/" + buildName + ".framework.js.unityweb",
        codeUrl: buildUrl + "/" + buildName + ".wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "via",
        productName: "KuumAR",
        productVersion: "0.1",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

      const script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = function () {
        loadingDebug.textContent = "Unity loader loaded. Creating instance...";

        createUnityInstance(canvas, config, function (progress) {
          const percent = Math.round(progress * 100);

          progressBarFull.style.transform = "scaleX(" + progress + ")";

          if (percent !== lastProgressPercent) {
            lastProgressPercent = percent;
            loadingDebug.textContent = "Loading: " + percent + "%";
          }
        })
          .then(function () {
            loadingBar.style.display = "none";

            setTimeout(function () {
              fillScreen();
              triggerUnityResize();
              startFullscreenRecoveryWatch("Unity loaded");
            }, 500);
          })
          .catch(function (err) {
            unityShowBanner(err, "error");
          });
      };

      script.onerror = function () {
        unityShowBanner("Could not load Unity loader script: " + loaderUrl, "error");
      };

      document.body.appendChild(script);
    };

    fillScreen();
  </script>
</body>
</html>
