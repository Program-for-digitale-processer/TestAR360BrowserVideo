<!DOCTYPE html>

<html lang="en-us">

<head>

  <meta charset="utf-8" />

  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <title>KuumAR fullscreen Test</title>



  <meta

    name="viewport"

    content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"

  />



  <style>

    /* 1. LOCK THE VIEWPORT */

    html,

    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      height: 100dvh;

      overflow: hidden;

      background: black;

      position: fixed;

      inset: 0;

      touch-action: none;

      overscroll-behavior: none;

    }



    #unity-container {

      position: fixed;

      inset: 0;

      width: 100vw;

      height: 100vh;

      height: 100dvh;

      background: #000;

      overflow: hidden;

    }



    #unity-canvas {

      background: black;

      display: block;

      width: 100%;

      height: 100%;

    }



    #unity-container:fullscreen {

      width: 100vw;

      height: 100vh;

    }



    #unity-container:-webkit-full-screen {

      width: 100vw;

      height: 100vh;

    }



    /* 2. START BUTTON OVERLAY */

    #custom-start-overlay {

      position: absolute;

      inset: 0;

      background: rgba(0, 0, 0, 0.9);

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      z-index: 1000;

    }



    #btn-play {

      padding: 20px 40px;

      font-size: 24px;

      color: white;

      background: #2196f3;

      border: none;

      border-radius: 12px;

      cursor: pointer;

      font-family: sans-serif;

      font-weight: bold;

    }



    /* 3. LOADING BAR */

    #unity-loading-bar {

      display: none;

      position: absolute;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      text-align: center;

      z-index: 900;

    }



    #unity-progress-bar-empty {

      width: 200px;

      height: 10px;

      background: #333;

      margin-top: 10px;

      border-radius: 5px;

      overflow: hidden;

    }



    #unity-progress-bar-full {

      width: 0%;

      height: 100%;

      background: white;

      border-radius: 5px;

      transition: width 0.2s;

    }



    /* 4. ORIENTATION WARNING */

    #orientation-warning {

      display: none;

      position: fixed;

      inset: 0;

      background: #000;

      color: white;

      z-index: 9999;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      font-family: sans-serif;

      padding: 20px;

    }



    @media screen and (orientation: portrait) and (max-width: 1024px) {

      #orientation-warning {

        display: flex;

      }

    }



    .rotate-icon {

      font-size: 60px;

      margin-bottom: 20px;

      display: inline-block;

      animation: rotate-phone 2s ease-in-out infinite;

    }



    @keyframes rotate-phone {

      0% {

        transform: rotate(0deg);

      }

      50% {

        transform: rotate(-90deg);

      }

      100% {

        transform: rotate(0deg);

      }

    }



    /* 5. RESTORE FULLSCREEN OVERLAY */

    #restore-fullscreen-overlay {

      display: none;

      position: absolute;

      inset: 0;

      background: rgba(0, 0, 0, 0.85);

      flex-direction: column;

      justify-content: center;

      align-items: center;

      z-index: 2000;

    }



    #btn-restore {

      padding: 15px 30px;

      font-size: 20px;

      color: white;

      background: #4caf50;

      border: none;

      border-radius: 12px;

      cursor: pointer;

      font-family: sans-serif;

      font-weight: bold;

    }



    .overlay-text {

      color: white;

      margin-top: 15px;

      font-family: sans-serif;

      opacity: 0.75;

      text-align: center;

      padding: 0 20px;

      max-width: 520px;

      line-height: 1.4;

    }

  </style>

</head>



<body>

  <div id="orientation-warning">

    <div class="rotate-icon">&#128241;</div>

    <p style="font-weight: bold;">Please rotate your device</p>

    <p style="opacity: 0.7; font-size: 0.9em;">

      Landscape mode is required for this experience.

    </p>

  </div>



  <div id="unity-container">

    <canvas id="unity-canvas" tabindex="-1"></canvas>



    <div id="custom-start-overlay">

      <button id="btn-play">START EXPERIENCE</button>

      <p class="overlay-text">

        Tap to begin. Make sure the device is in landscape position.

      </p>

    </div>



    <div id="restore-fullscreen-overlay">

      <button id="btn-restore">RESTORE FULLSCREEN</button>

      <p class="overlay-text">

        Fullscreen was interrupted. Tap to resume.

      </p>

    </div>



    <div id="unity-loading-bar">

      <div id="unity-progress-bar-empty">

        <div id="unity-progress-bar-full"></div>

      </div>

    </div>

  </div>



  <script>

    const container = document.querySelector("#unity-container");

    const canvas = document.querySelector("#unity-canvas");

    const loadingBar = document.querySelector("#unity-loading-bar");

    const progressBarFull = document.querySelector("#unity-progress-bar-full");

    const startOverlay = document.querySelector("#custom-start-overlay");

    const playButton = document.querySelector("#btn-play");

    const restoreOverlay = document.querySelector("#restore-fullscreen-overlay");

    const restoreButton = document.querySelector("#btn-restore");



    let started = false;

    let isUnityLoaded = false;

    let fillScreenScheduled = false;



    function unityShowBanner(msg, type) {

      if (type !== "error") return;



      if (document.getElementById("unity-crash-overlay")) return;



      const overlay = document.createElement("div");

      overlay.id = "unity-crash-overlay";



      Object.assign(overlay.style, {

        position: "fixed",

        top: "0",

        left: "0",

        width: "100%",

        height: "100%",

        backgroundColor: "rgba(0,0,0,0.95)",

        display: "flex",

        flexDirection: "column",

        justifyContent: "center",

        alignItems: "center",

        zIndex: "10000",

        color: "white",

        fontFamily: "sans-serif",

        textAlign: "center",

        padding: "20px",

        boxSizing: "border-box"

      });



      const box = document.createElement("div");



      const title = document.createElement("h2");

      title.textContent = "Error";

      title.style.color = "#ff4444";



      const message = document.createElement("p");

      message.textContent = String(msg);



      const button = document.createElement("button");

      button.textContent = "REFRESH";

      Object.assign(button.style, {

        padding: "10px 20px",

        background: "#2196F3",

        border: "none",

        color: "white",

        borderRadius: "5px",

        cursor: "pointer"

      });

      button.onclick = function () {

        location.reload();

      };



      box.appendChild(title);

      box.appendChild(message);

      box.appendChild(button);

      overlay.appendChild(box);

      document.body.appendChild(overlay);

    }



    function isNativeFullscreen() {

      return !!(

        document.fullscreenElement ||

        document.webkitFullscreenElement

      );

    }



    function fillScreen() {

      const vv = window.visualViewport;

      const width = vv ? vv.width : window.innerWidth;

      const height = vv ? vv.height : window.innerHeight;



      document.documentElement.style.overflow = "hidden";

      document.body.style.overflow = "hidden";

      document.body.style.margin = "0";

      document.body.style.padding = "0";



      container.style.width = width + "px";

      container.style.height = height + "px";



      canvas.style.width = "100%";

      canvas.style.height = "100%";



      window.scrollTo(0, 0);

    }



    function scheduleFillScreen() {

      if (fillScreenScheduled) return;



      fillScreenScheduled = true;



      requestAnimationFrame(function () {

        fillScreenScheduled = false;

        fillScreen();

      });

    }



    function triggerUnityResize() {

      requestAnimationFrame(function () {

        window.dispatchEvent(new Event("resize"));



        setTimeout(function () {

          window.dispatchEvent(new Event("resize"));

        }, 50);

      });

    }



    async function requestAppFullscreen() {

      fillScreen();



      try {

        if (container.requestFullscreen) {

          await container.requestFullscreen();

        } else if (container.webkitRequestFullscreen) {

          await container.webkitRequestFullscreen();

        } else {

          console.warn("Fullscreen API is not available in this browser.");

        }

      } catch (e) {

        console.warn("Fullscreen request failed:", e);

      }



      try {

        if (screen.orientation && screen.orientation.lock) {

          await screen.orientation.lock("landscape");

        }

      } catch (e) {

        console.warn("Orientation lock failed:", e);

      }



      fillScreen();

      triggerUnityResize();



      return isNativeFullscreen();

    }



    function handleFullscreenChange() {

      if (!started) return;



      if (isNativeFullscreen()) {

        restoreOverlay.style.display = "none";

      } else {

        if (isUnityLoaded) {

          restoreOverlay.style.display = "flex";

        }

      }



      scheduleFillScreen();

      triggerUnityResize();

    }



    document.addEventListener("fullscreenchange", handleFullscreenChange);

    document.addEventListener("webkitfullscreenchange", handleFullscreenChange);



    restoreButton.onclick = async function () {

      restoreOverlay.style.display = "none";



      const fullscreenSucceeded = await requestAppFullscreen();



      if (!fullscreenSucceeded && isUnityLoaded) {

        restoreOverlay.style.display = "flex";

      }

    };



    playButton.onclick = async function () {

      if (started) return;



      const isPortraitMobile =

        window.innerHeight > window.innerWidth &&

        window.innerWidth < 1024;



      if (isPortraitMobile) {

        alert("Please rotate to landscape first!");

        return;

      }



      started = true;

      startOverlay.style.display = "none";

      loadingBar.style.display = "block";



      await requestAppFullscreen();



      const buildUrl = "Build";

      const loaderUrl = buildUrl + "/Parnumaa_FullscreenTesting.loader.js";



      const config = {

        dataUrl: buildUrl + "/Parnumaa_FullscreenTesting.data.unityweb",

        frameworkUrl: buildUrl + "/Parnumaa_FullscreenTesting.framework.js.unityweb",

        codeUrl: buildUrl + "/Parnumaa_FullscreenTesting.wasm.unityweb",

        streamingAssetsUrl: "StreamingAssets",

        companyName: "via",

        productName: "KuumAR",

        productVersion: "0.1",

        showBanner: unityShowBanner,

        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)

      };



      const script = document.createElement("script");

      script.src = loaderUrl;



      script.onload = function () {

        createUnityInstance(canvas, config, function (progress) {

          progressBarFull.style.width = progress * 100 + "%";

        })

          .then(function () {

            loadingBar.style.display = "none";

            isUnityLoaded = true;



            setTimeout(function () {

              fillScreen();

              triggerUnityResize();



              if (!isNativeFullscreen()) {

                restoreOverlay.style.display = "flex";

              }

            }, 500);

          })

          .catch(function (err) {

            unityShowBanner(err, "error");

          });

      };



      script.onerror = function () {

        unityShowBanner("Could not load Unity loader script: " + loaderUrl, "error");

      };



      document.body.appendChild(script);

    };



    window.addEventListener("resize", function () {

      scheduleFillScreen();

    });



    if (window.visualViewport) {

      window.visualViewport.addEventListener("resize", function () {

        scheduleFillScreen();

      });

    }



    fillScreen();

  </script>

</body>

</html>
